<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Catalog & Material Management</title>
    <!-- SheetJS for Google Sheets / CSV Integration -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --bg-surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --modal-bg: rgba(15, 23, 42, 0.6);
            --header-bg: rgba(255, 255, 255, 0.9);
            --badge-bg: #f1f5f9;
            --badge-text: #334155;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-surface: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --accent-color: #3b82f6;
            --accent-hover: #60a5fa;
            --card-bg: #1e293b;
            --card-border: #334155;
            --modal-bg: rgba(0, 0, 0, 0.75);
            --header-bg: rgba(30, 41, 59, 0.9);
            --badge-bg: #334155;
            --badge-text: #cbd5e1;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }

        /* Header Navigation */
        header {
            position: sticky;
            top: 0;
            z-index: 40;
            background-color: var(--header-bg);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text-primary);
            cursor: pointer;
            user-select: none;
        }

        .logo-icon {
            background-color: var(--accent-color);
            color: white;
            padding: 0.5rem;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-bar {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-surface);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        .search-bar input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            width: 18px;
            height: 18px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            border: 1px solid transparent;
            background-color: var(--bg-surface);
            color: var(--text-primary);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-outline {
            border-color: var(--border-color);
        }

        .btn-outline:hover {
            background-color: var(--badge-bg);
        }

        .cart-btn {
            position: relative;
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ef4444;
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 9999px;
            padding: 0.15rem 0.4rem;
            min-width: 18px;
            text-align: center;
        }

        /* Controls Section */
        .controls-section {
            max-width: 1400px;
            margin: 1.5rem auto 0;
            padding: 0 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        .categories-scroll {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            scrollbar-width: thin;
        }

        .category-chip {
            padding: 0.4rem 0.8rem;
            border-radius: 9999px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .category-chip.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        /* Grid Layout */
        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
        }

        .admin-banner {
            display: none;
            background-color: #f59e0b;
            color: #78350f;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
            position: relative;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .card-checkbox {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            z-index: 10;
            width: 20px;
            height: 20px;
            display: none;
            cursor: pointer;
        }

        .card-img-wrapper {
            width: 100%;
            height: 180px;
            background-color: var(--badge-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .card-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
            font-weight: 600;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-code {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
            font-family: monospace;
        }

        .card-footer {
            margin-top: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-color);
        }

        .stock-tag {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: var(--radius-md);
            background-color: var(--badge-bg);
            color: var(--badge-text);
        }

        .stock-tag.in-stock {
            background-color: #dcfce7;
            color: #166534;
        }

        [data-theme="dark"] .stock-tag.in-stock {
            background-color: #166534;
            color: #dcfce7;
        }

        .load-more-container {
            text-align: center;
            margin: 2rem 0;
        }

        /* Modal Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-bg);
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-surface);
            border-radius: var(--radius-lg);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }

        .modal-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-body {
            padding: 1.5rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.25rem;
        }

        /* Quantity controls */
        .qty-control {
            display: flex;
            align-items: center;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            width: fit-content;
        }

        .qty-btn {
            background: none;
            border: none;
            padding: 0.4rem 0.8rem;
            color: var(--text-primary);
            cursor: pointer;
            font-weight: 600;
        }

        .qty-input {
            width: 50px;
            text-align: center;
            border: none;
            background: none;
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Cart Items List */
        .cart-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-item-details {
            flex: 1;
            padding-right: 1rem;
        }

        /* Canvas output container */
        .poster-preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .poster-card {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.5rem;
            text-align: center;
        }

        .poster-card canvas {
            width: 100%;
            height: auto;
            border-radius: var(--radius-md);
        }

        /* Footer */
        footer {
            border-top: 1px solid var(--border-color);
            background-color: var(--bg-surface);
            padding: 2rem 1.5rem;
            margin-top: auto;
        }

        .footer-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 2rem;
        }

        .footer-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .footer-links a:hover {
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <!-- Main Navigation Header -->
    <header>
        <div class="header-container">
            <div class="logo" id="appLogo" title="Triple click for Admin Portal">
                <div class="logo-icon"><i data-lucide="package"></i></div>
                <span>StockCatalog</span>
            </div>
            
            <div class="search-bar">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search code, description, category (e.g. PIPE SCH 40)...">
            </div>

            <div class="header-actions">
                <button class="btn btn-outline" id="themeToggleBtn" title="Toggle Light/Dark Theme">
                    <i data-lucide="moon" id="themeIcon"></i>
                </button>
                <button class="btn btn-primary cart-btn" id="openCartBtn">
                    <i data-lucide="shopping-cart"></i>
                    <span>RFQ Cart</span>
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Controls & Categories Filter -->
    <div class="controls-section">
        <div class="categories-scroll" id="categoriesContainer">
            <button class="category-chip active" data-category="ALL">All Materials</button>
            <button class="category-chip" data-category="PIPE">Pipes</button>
            <button class="category-chip" data-category="FITTING">Fittings</button>
            <button class="category-chip" data-category="FLANGE">Flanges</button>
            <button class="category-chip" data-category="VALVE">Valves</button>
            <button class="category-chip" data-category="FASTENER">Fasteners & Gaskets</button>
            <button class="category-chip" data-category="OTHER">Other Products</button>
        </div>
        <div id="resultsCount" style="font-size: 0.85rem; color: var(--text-secondary);">
            Showing 0 items
        </div>
    </div>

    <!-- Main Content Area -->
    <main>
        <!-- Admin Mode Bar -->
        <div class="admin-banner" id="adminBanner">
            <span><i data-lucide="shield-alert"></i> Admin Portal Active — Poster Generation Mode</span>
            <div>
                <button class="btn btn-primary" id="generatePostersBtn"><i data-lucide="image"></i> Generate Social Cards</button>
                <button class="btn btn-outline" id="exitAdminBtn">Exit Admin</button>
            </div>
        </div>

        <!-- Product Cards Grid -->
        <div class="catalog-grid" id="catalogGrid"></div>

        <!-- Load More Pagination -->
        <div class="load-more-container">
            <button class="btn btn-outline" id="loadMoreBtn" style="display: none;">
                <i data-lucide="chevron-down"></i> More Materials
            </button>
        </div>
    </main>

    <!-- Detailed Item View Modal -->
    <div class="modal" id="itemModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Material Details</h3>
                <button class="close-btn" class="modalCloseBtn"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div style="height: 240px; background-color: var(--badge-bg); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 1rem;">
                    <img id="modalImg" src="" alt="Material Preview" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div id="modalCategory" class="card-category"></div>
                <h2 id="modalName" style="font-size: 1.25rem; margin-bottom: 0.5rem;"></h2>
                <p id="modalCode" class="card-code"></p>
                <div style="display: flex; justify-content: space-between; align-items: center; margin: 1.5rem 0;">
                    <div>
                        <span style="font-size: 0.85rem; color: var(--text-secondary);">Available Stock:</span>
                        <div id="modalStock" class="stock-tag" style="display: inline-block; margin-left: 0.5rem;"></div>
                    </div>
                    <div class="qty-control">
                        <button class="qty-btn" id="modalQtyMinus">-</button>
                        <input type="text" id="modalQtyInput" class="qty-input" value="1" readonly>
                        <button class="qty-btn" id="modalQtyPlus">+</button>
                    </div>
                </div>
                <button class="btn btn-primary" id="modalAddToCartBtn" style="width: 100%; padding: 0.75rem;">
                    <i data-lucide="shopping-cart"></i> Add to RFQ List
                </button>
            </div>
        </div>
    </div>

    <!-- Cart / RFQ Modal -->
    <div class="modal" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Request for Quotation (RFQ) List</h3>
                <button class="close-btn" class="modalCloseBtn"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div id="cartItemsList" style="max-height: 300px; overflow-y: auto; margin-bottom: 1.5rem;">
                    <!-- Cart items render here -->
                </div>
                <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                    <button class="btn btn-primary" id="sendMailToBtn" style="width: 100%;">
                        <i data-lucide="mail"></i> Send via Default Mail Client (mailto:)
                    </button>
                    <button class="btn btn-outline" id="sendOutlookBtn" style="width: 100%;">
                        <i data-lucide="external-link"></i> Send via Outlook Web
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Poster Generator Modal -->
    <div class="modal" id="posterModal">
        <div class="modal-content" style="max-width: 900px;">
            <div class="modal-header">
                <h3>Generated Social Media Promotional Cards</h3>
                <button class="close-btn" class="modalCloseBtn"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <div class="poster-preview-grid" id="posterPreviewGrid"></div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <div>
                <div class="logo" style="margin-bottom: 0.5rem;">
                    <div class="logo-icon"><i data-lucide="package"></i></div>
                    <span>StockCatalog</span>
                </div>
                <p style="font-size: 0.85rem; color: var(--text-secondary);">Industrial Piping, Valve, & Fitting Stock Portal</p>
            </div>
            <div class="footer-links">
                <a href="#" class="footer-cat-link" data-cat="PIPE">Pipes</a>
                <a href="#" class="footer-cat-link" data-cat="FITTING">Fittings</a>
                <a href="#" class="footer-cat-link" data-cat="FLANGE">Flanges</a>
                <a href="#" class="footer-cat-link" data-cat="VALVE">Valves</a>
                <a href="#" class="footer-cat-link" data-cat="FASTENER">Fasteners</a>
            </div>
        </div>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Default Mock Inventory Seed Data
        const INITIAL_CATALOG = [
            { code: "VAL-GT-001", description: "GATE VALVE 2 INCH CLASS 150 RF FLANGED BODY A216 WCB", stock: 45, category: "VALVE" },
            { code: "VAL-BL-002", description: "BALL VALVE 1 INCH 1000 WOG THREADED NPT SS316", stock: 120, category: "VALVE" },
            { code: "PIP-CS-010", description: "PIPE ERW 3/4 INCH X 5.8MTR SCH 40 API 5L GRADE B", stock: 250, category: "PIPE" },
            { code: "PIP-SS-011", description: "NIPPLE PIPE 1/2 INCH X 100MM SCH 80 SS316L NPT", stock: 80, category: "PIPE" },
            { code: "FLG-WN-005", description: "FLANGE WELD NECK 3 INCH CLASS 300 SCH 40 ASME B16.5 A105", stock: 30, category: "FLANGE" },
            { code: "FIT-EL-020", description: "ELBOW 90 DEGREE 2 INCH SCH 40 BW ASTM A234 WPB", stock: 150, category: "FITTING" },
            { code: "FAS-BL-101", description: "BOLT HEX WITH NUT 5/8 INCH X 3 INCH A193 B7 / A194 2H", stock: 500, category: "FASTENER" },
            { code: "FAS-GK-102", description: "GASKET SPIRAL WOUND 2 INCH CLASS 150 SS316 WITH GRAPHITE FILLER", stock: 200, category: "FASTENER" }
        ];

        // Global State Configuration
        let materialsData = [];
        let filteredMaterials = [];
        let rfqCart = [];
        let currentPage = 1;
        const ITEMS_PER_PAGE = 60;
        let selectedCategory = "ALL";
        let isAdminActive = false;
        let logoClickCount = 0;
        let logoClickTimer = null;

        // Auto Category Detection Helper
        function detectCategory(desc) {
            const upper = desc.toUpperCase();
            if (upper.includes("VALVE")) return "VALVE";
            if (upper.includes("PIPE") || upper.includes("NIPPLE")) return "PIPE";
            if (upper.includes("FLANGE")) return "FLANGE";
            if (upper.includes("ELBOW") || upper.includes("TEE") || upper.includes("REDUCER") || upper.includes("FITTING")) return "FITTING";
            if (upper.includes("BOLT") || upper.includes("NUT") || upper.includes("GASKET") || upper.includes("FASTENER")) return "FASTENER";
            return "OTHER";
        }

        // Image Resolver Mapping
        function resolveProductImage(desc) {
            const upper = desc.toUpperCase();
            if (upper.includes("GATE VALVE")) return "https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=500&q=80";
            if (upper.includes("VALVE")) return "https://images.unsplash.com/photo-1581092335397-9583fe92d232?w=500&q=80";
            if (upper.includes("PIPE") || upper.includes("NIPPLE")) return "https://images.unsplash.com/photo-1542013936693-884638332954?w=500&q=80";
            if (upper.includes("FLANGE")) return "https://images.unsplash.com/photo-1504307651254-35680f356dfd?w=500&q=80";
            if (upper.includes("FASTENER") || upper.includes("BOLT") || upper.includes("GASKET")) return "https://images.unsplash.com/photo-1586864387967-d02ef85d93e8?w=500&q=80";
            return "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=500&q=80";
        }

        // Initialize Application
        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            loadInventoryData();
            setupEventListeners();
            checkUrlDeepLink();
        });

        // Load Stock Data with Fallbacks
        async function loadInventoryData() {
            try {
                // Example Live Google Sheet CSV Endpoint integration pattern
                const response = await fetch("https://docs.google.com/spreadsheets/d/e/2PACX-1vGplaceholder/pub?output=csv");
                if (response.ok) {
                    const csvText = await response.text();
                    const workbook = XLSX.read(csvText, { type: "string" });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const parsed = XLSX.utils.sheet_to_json(sheet);
                    materialsData = parsed.map(item => ({
                        code: item.Code || item.code || "N/A",
                        description: item.Description || item.description || "Unspecified Material",
                        stock: parseInt(item.Stock || item.stock || 0, 10),
                        category: detectCategory(item.Description || item.description || "")
                    }));
                } else {
                    throw new Error("Live sheet fetch failed");
                }
            } catch (err) {
                console.log("Using seed inventory fallback");
                materialsData = INITIAL_CATALOG;
            }
            applyFilters();
        }

        // Filter and Search System
        function applyFilters() {
            const query = document.getElementById("searchInput").value.toLowerCase().trim();
            const terms = query.split(/\s+/).filter(Boolean);

            filteredMaterials = materialsData.filter(item => {
                const matchesCat = (selectedCategory === "ALL") || (item.category === selectedCategory);
                const targetText = `${item.code} ${item.description} ${item.category}`.toLowerCase();
                const matchesSearch = terms.every(term => targetText.includes(term));
                return matchesCat && matchesSearch;
            });

            currentPage = 1;
            renderCatalogGrid();
        }

        // Render Cards Grid
        function renderCatalogGrid() {
            const grid = document.getElementById("catalogGrid");
            grid.innerHTML = "";

            const displayItems = filteredMaterials.slice(0, currentPage * ITEMS_PER_PAGE);

            if (displayItems.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-secondary);">No stock items found matching criteria.</div>`;
                document.getElementById("loadMoreBtn").style.display = "none";
                document.getElementById("resultsCount").innerText = "Showing 0 items";
                return;
            }

            displayItems.forEach((item, idx) => {
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                    <input type="checkbox" class="card-checkbox" data-code="${item.code}">
                    <div class="card-img-wrapper">
                        <img src="${resolveProductImage(item.description)}" class="card-img" alt="${item.description}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=500&q=80'">
                    </div>
                    <div class="card-body">
                        <div class="card-category">${item.category}</div>
                        <div class="card-title">${item.description}</div>
                        <div class="card-code">Code: ${item.code}</div>
                        <div class="card-footer">
                            <span class="stock-tag ${item.stock > 0 ? 'in-stock' : ''}">${item.stock} in stock</span>
                            <button class="btn btn-outline card-add-btn" data-idx="${idx}" style="padding: 0.3rem 0.6rem; font-size: 0.8rem;">
                                <i data-lucide="plus"></i> Add RFQ
                            </button>
                        </div>
                    </div>
                `;

                // Item detail click trigger
                card.addEventListener("click", (e) => {
                    if (!e.target.closest(".card-add-btn") && !e.target.closest(".card-checkbox")) {
                        openItemModal(item);
                    }
                });

                // Fast add to cart button
                card.querySelector(".card-add-btn").addEventListener("click", (e) => {
                    e.stopPropagation();
                    addToCart(item, 1);
                });

                grid.appendChild(card);
            });

            lucide.createIcons();

            // Toggle admin selection checkboxes
            const checkboxes = document.querySelectorAll(".card-checkbox");
            checkboxes.forEach(cb => cb.style.display = isAdminActive ? "block" : "none");

            // Load more state
            const loadMoreBtn = document.getElementById("loadMoreBtn");
            if (filteredMaterials.length > displayItems.length) {
                loadMoreBtn.style.display = "inline-flex";
            } else {
                loadMoreBtn.style.display = "none";
            }

            document.getElementById("resultsCount").innerText = `Showing ${displayItems.length} of ${filteredMaterials.length} items`;
        }

        // Cart State & Modal Operations
        function addToCart(item, qty) {
            const existing = rfqCart.find(c => c.code === item.code);
            if (existing) {
                existing.qty = Math.min(existing.qty + qty, item.stock);
            } else {
                rfqCart.push({ ...item, qty: Math.min(qty, item.stock) });
            }
            updateCartBadge();
        }

        function updateCartBadge() {
            const total = rfqCart.reduce((sum, i) => sum + i.qty, 0);
            document.getElementById("cartBadge").innerText = total;
        }

        function renderCartModal() {
            const container = document.getElementById("cartItemsList");
            container.innerHTML = "";

            if (rfqCart.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-secondary); padding: 2rem;">Your RFQ list is currently empty.</div>`;
                return;
            }

            rfqCart.forEach((item, index) => {
                const el = document.createElement("div");
                el.className = "cart-item";
                el.innerHTML = `
                    <div class="cart-item-details">
                        <div style="font-weight: 600; font-size: 0.9rem;">${item.description}</div>
                        <div style="font-size: 0.75rem; color: var(--text-secondary);">${item.code}</div>
                    </div>
                    <div class="qty-control" style="margin-right: 1rem;">
                        <button class="qty-btn dec-cart" data-index="${index}">-</button>
                        <input type="text" class="qty-input" value="${item.qty}" readonly>
                        <button class="qty-btn inc-cart" data-index="${index}">+</button>
                    </div>
                    <button class="btn btn-outline remove-cart" data-index="${index}" style="padding: 0.3rem; border: none; color: #ef4444;">
                        <i data-lucide="trash-2" style="width: 18px; height: 18px;"></i>
                    </button>
                `;
                container.appendChild(el);
            });

            lucide.createIcons();

            container.querySelectorAll(".dec-cart").forEach(b => b.addEventListener("click", (e) => {
                const idx = e.target.dataset.index;
                if (rfqCart[idx].qty > 1) rfqCart[idx].qty--;
                renderCartModal();
                updateCartBadge();
            }));

            container.querySelectorAll(".inc-cart").forEach(b => b.addEventListener("click", (e) => {
                const idx = e.target.dataset.index;
                if (rfqCart[idx].qty < rfqCart[idx].stock) rfqCart[idx].qty++;
                renderCartModal();
                updateCartBadge();
            }));

            container.querySelectorAll(".remove-cart").forEach(b => b.addEventListener("click", (e) => {
                const idx = e.target.dataset.index;
                rfqCart.splice(idx, 1);
                renderCartModal();
                updateCartBadge();
            }));
        }

        // Detailed Item Modal
        let activeModalItem = null;
        function openItemModal(item) {
            activeModalItem = item;
            document.getElementById("modalTitle").innerText = item.code;
            document.getElementById("modalName").innerText = item.description;
            document.getElementById("modalCode").innerText = `Item Code: ${item.code}`;
            document.getElementById("modalCategory").innerText = item.category;
            document.getElementById("modalStock").innerText = `${item.stock} Available`;
            document.getElementById("modalImg").src = resolveProductImage(item.description);
            document.getElementById("modalQtyInput").value = 1;

            document.getElementById("itemModal").classList.add("active");
        }

        // Dynamic Event Listeners Setup
        function setupEventListeners() {
            // Search Input
            document.getElementById("searchInput").addEventListener("input", applyFilters);

            // Category Chips Filter
            document.getElementById("categoriesContainer").addEventListener("click", (e) => {
                if (e.target.classList.contains("category-chip")) {
                    document.querySelectorAll(".category-chip").forEach(c => c.classList.remove("active"));
                    e.target.classList.add("active");
                    selectedCategory = e.target.dataset.category;
                    applyFilters();
                }
            });

            // Pagination Load More
            document.getElementById("loadMoreBtn").addEventListener("click", () => {
                currentPage++;
                renderCatalogGrid();
            });

            // Theme Toggle Slider with View Transitions API support
            document.getElementById("themeToggleBtn").addEventListener("click", () => {
                const toggleTheme = () => {
                    const current = document.documentElement.getAttribute("data-theme");
                    const next = current === "dark" ? "light" : "dark";
                    document.documentElement.setAttribute("data-theme", next);
                    document.getElementById("themeIcon").setAttribute("data-lucide", next === "dark" ? "sun" : "moon");
                    lucide.createIcons();
                };

                if (!document.startViewTransition) {
                    toggleTheme();
                } else {
                    document.startViewTransition(() => toggleTheme());
                }
            });

            // Cart Modals
            document.getElementById("openCartBtn").addEventListener("click", () => {
                renderCartModal();
                document.getElementById("cartModal").classList.add("active");
            });

            document.querySelectorAll(".modalCloseBtn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    e.target.closest(".modal").classList.remove("active");
                });
            });

            // Item Modal Qty controls
            document.getElementById("modalQtyMinus").addEventListener("click", () => {
                const input = document.getElementById("modalQtyInput");
                let val = parseInt(input.value, 10);
                if (val > 1) input.value = val - 1;
            });

            document.getElementById("modalQtyPlus").addEventListener("click", () => {
                const input = document.getElementById("modalQtyInput");
                let val = parseInt(input.value, 10);
                if (activeModalItem && val < activeModalItem.stock) input.value = val + 1;
            });

            document.getElementById("modalAddToCartBtn").addEventListener("click", () => {
                if (activeModalItem) {
                    const qty = parseInt(document.getElementById("modalQtyInput").value, 10);
                    addToCart(activeModalItem, qty);
                    document.getElementById("itemModal").classList.remove("active");
                }
            });

            // RFQ Mail Submissions
            document.getElementById("sendMailToBtn").addEventListener("click", () => generateEmailRFQ(false));
            document.getElementById("sendOutlookBtn").addEventListener("click", () => generateEmailRFQ(true));

            // Admin Portal Activations (Triple Click Logo or Ctrl+Shift+A)
            document.getElementById("appLogo").addEventListener("click", () => {
                logoClickCount++;
                clearTimeout(logoClickTimer);
                logoClickTimer = setTimeout(() => logoClickCount = 0, 500);
                if (logoClickCount >= 3) {
                    logoClickCount = 0;
                    promptAdminPin();
                }
            });

            window.addEventListener("keydown", (e) => {
                if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'A' || e.key === 'a')) {
                    e.preventDefault();
                    promptAdminPin();
                }
            });

            document.getElementById("exitAdminBtn").addEventListener("click", () => {
                isAdminActive = false;
                document.getElementById("adminBanner").style.display = "none";
                renderCatalogGrid();
            });

            document.getElementById("generatePostersBtn").addEventListener("click", generateSocialPosters);

            // Footer dynamic links
            document.querySelectorAll(".footer-cat-link").forEach(link => {
                link.addEventListener("click", (e) => {
                    e.preventDefault();
                    const cat = e.target.dataset.cat;
                    selectedCategory = cat;
                    document.querySelectorAll(".category-chip").forEach(c => {
                        c.classList.toggle("active", c.dataset.category === cat);
                    });
                    applyFilters();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });
        }

        // Email RFQ Handler
        function generateEmailRFQ(isOutlook) {
            if (rfqCart.length === 0) return alert("Your RFQ list is empty.");

            let body = "Material Request for Quotation:\n\n";
            rfqCart.forEach((item, i) => {
                body += `${i + 1}. [${item.code}] ${item.description} - Qty: ${item.qty}\n`;
            });
            body += "\nPlease provide pricing and availability.";

            const subject = encodeURIComponent("RFQ - Industrial Material Inquiry");
            const encodedBody = encodeURIComponent(body);

            if (isOutlook) {
                window.open(`https://outlook.office.com/mail/deeplink/compose?subject=${subject}&body=${encodedBody}`, '_blank');
            } else {
                window.location.href = `mailto:sales@example.com?subject=${subject}&body=${encodedBody}`;
            }
        }

        // Secret Admin Authentication
        function promptAdminPin() {
            const pin = prompt("Enter Admin Passcode:");
            if (pin === "Jesus07dp") {
                isAdminActive = true;
                document.getElementById("adminBanner").style.display = "flex";
                renderCatalogGrid();
                alert("Admin Mode Activated: Select items to generate social media poster cards.");
            } else if (pin !== null) {
                alert("Invalid Passcode");
            }
        }

        // HTML5 Canvas Instagram Poster Slide Generator (1080x1080)
        function generateSocialPosters() {
            const selectedCodes = Array.from(document.querySelectorAll(".card-checkbox:checked")).map(cb => cb.dataset.code);
            const itemsToProcess = materialsData.filter(m => selectedCodes.includes(m.code));

            if (itemsToProcess.length === 0) {
                return alert("Please select at least one material card using the checkboxes.");
            }

            const grid = document.getElementById("posterPreviewGrid");
            grid.innerHTML = "";

            itemsToProcess.forEach(item => {
                const container = document.createElement("div");
                container.className = "poster-card";

                const canvas = document.createElement("canvas");
                canvas.width = 1080;
                canvas.height = 1080;
                const ctx = canvas.getContext("2d");

                // Canvas Drawing
                // Background Gradient
                const grad = ctx.createLinearGradient(0, 0, 1080, 1080);
                grad.addColorStop(0, "#0f172a");
                grad.addColorStop(1, "#1e293b");
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 1080, 1080);

                // Accent Top Border
                ctx.fillStyle = "#2563eb";
                ctx.fillRect(0, 0, 1080, 24);

                // Header Badge
                ctx.fillStyle = "#334155";
                ctx.fillRect(80, 80, 240, 60);
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 28px sans-serif";
                ctx.fillText(item.category, 100, 120);

                // Product Title
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 44px sans-serif";
                
                // Text Wrap helper
                const words = item.description.split(" ");
                let line = "";
                let y = 240;
                for (let n = 0; n < words.length; n++) {
                    let testLine = line + words[n] + " ";
                    let metrics = ctx.measureText(testLine);
                    if (metrics.width > 920 && n > 0) {
                        ctx.fillText(line, 80, y);
                        line = words[n] + " ";
                        y += 55;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line, 80, y);

                // Product Code Subtitle
                ctx.fillStyle = "#94a3b8";
                ctx.font = "32px monospace";
                ctx.fillText(`CODE: ${item.code}`, 80, y + 60);

                // Stock Status Tag
                ctx.fillStyle = "#166534";
                ctx.fillRect(80, y + 120, 300, 70);
                ctx.fillStyle = "#dcfce7";
                ctx.font = "bold 32px sans-serif";
                ctx.fillText(`STOCK: ${item.stock} UNITS`, 100, y + 165);

                // Footer Call-to-action
                ctx.fillStyle = "#64748b";
                ctx.fillRect(80, 960, 920, 2);
                ctx.fillStyle = "#94a3b8";
                ctx.font = "28px sans-serif";
                ctx.fillText("Industrial Supply & Materials Portal", 80, 1010);

                container.appendChild(canvas);

                // Action Buttons for Card
                const actions = document.createElement("div");
                actions.style.marginTop = "0.5rem";
                actions.style.display = "flex";
                actions.style.gap = "0.5rem";
                actions.style.justifyContent = "center";

                const downloadBtn = document.createElement("button");
                downloadBtn.className = "btn btn-outline";
                downloadBtn.style.padding = "0.3rem 0.6rem";
                downloadBtn.innerText = "Download";
                downloadBtn.onclick = () => {
                    const link = document.createElement("a");
                    link.download = `Poster-${item.code}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                };

                actions.appendChild(downloadBtn);
                container.appendChild(actions);
                grid.appendChild(container);
            });

            document.getElementById("posterModal").classList.add("active");
        }

        // URL Deep Linking Support (?item=CODE)
        function checkUrlDeepLink() {
            const params = new URLSearchParams(window.location.search);
            const itemCode = params.get("item");
            if (itemCode) {
                const item = materialsData.find(m => m.code.toLowerCase() === itemCode.toLowerCase());
                if (item) {
                    openItemModal(item);
                }
            }
        }
    </script>
</body>
